<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TaskFlow</div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="add-task.html">Add Task</a></li>
                <li><a href="task-list.html" class="active">Task List</a></li>
                <li><a href="task-detail.html">Task Detail</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="list-header">
            <h1>All Tasks</h1>
            <div class="filter-buttons">
                <button class="btn active">All</button>
                <button class="btn">Pending</button>
                <button class="btn">Completed</button>
            </div>
        </section>

        <section class="table-responsive">
            <table class="task-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Setup CI/CD Pipeline</td>
                        <td>2026-06-20</td>
                        <td><span class="badge high">High</span></td>
                        <td><span class="status complete">Completed</span></td>
                        <td><a href="task-detail.html" class="view-link">View</a></td>
                    </tr>
                    <tr>
                        <td>Design Dashboard UI</td>
                        <td>2026-06-22</td>
                        <td><span class="badge medium">Medium</span></td>
                        <td><span class="status pending">Pending</span></td>
                        <td><a href="task-detail.html" class="view-link">View</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TaskFlow DevOps Team. All rights reserved.</p>
    </footer>
</body>
</html>
