name: CI Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t taskflow .

      - name: Tag Image
        run: |
          docker tag taskflow \
          ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest
