name: CD Pipeline

on:
  push:
    branches:
      - develop

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: development

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Confirm
        run: |
          echo "Deployment completed"
